<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather dashboard of gaurav</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f7fb; min-height: 100vh; }
        .navbar-brand { font-weight: 700; }
        .weather-container { max-width: 1000px; margin: 40px auto; }
        .weather-card { border: none; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
        .weather-icon { width: 100px; height: 100px; }
        .temperature { font-size: 4rem; font-weight: 700; }
        .weather-detail { background: #f8f9fa; border-radius: 15px; padding: 20px; height: 100%; }
        #loading, #weatherResult, #errorMessage { display: none; }
    </style>
</head>

<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">🌤️ Weather Dashboard.g</a>
    </div>
</nav>

<main class="container weather-container">
    <div class="text-center mb-4">
        <h1 class="fw-bold">Weather Dashboard.g</h1>
        <p class="text-muted">Search for a city to see current weather conditions.</p>
    </div>

    <form id="weatherForm" class="row g-2 justify-content-center mb-4">
        <div class="col-md-8">
            <input id="cityInput" class="form-control form-control-lg"
                   type="search" placeholder="Enter city name, e.g. Delhi"
                   aria-label="City name" required>
        </div>
        <div class="col-md-2 d-grid">
            <button id="searchButton" class="btn btn-primary btn-lg" type="submit">
                Search
            </button>
        </div>
    </form>

    <div id="loading" class="text-center my-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 text-muted">Fetching weather data...</p>
    </div>

    <div id="errorMessage" class="alert alert-danger text-center" role="alert"></div>

    <section id="weatherResult" class="card weather-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center">
                <h2 id="cityName" class="fw-bold mb-1"></h2>
                <p id="weatherDescription" class="text-muted text-capitalize mb-3"></p>
                <img id="weatherIcon" class="weather-icon" src="" alt="Weather icon">
                <div id="temperature" class="temperature">--°C</div>
                <p id="feelsLike" class="text-muted"></p>
            </div>

            <div class="row g-3 mt-3">
                <div class="col-md-4">
                    <div class="weather-detail text-center">
                        <div class="fs-2">💧</div>
                        <h5>Humidity</h5>
                        <p id="humidity" class="fs-4 fw-semibold mb-0">--%</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="weather-detail text-center">
                        <div class="fs-2">💨</div>
                        <h5>Wind Speed</h5>
                        <p id="windSpeed" class="fs-4 fw-semibold mb-0">-- m/s</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="weather-detail text-center">
                        <div class="fs-2">☁️</div>
                        <h5>Cloudiness</h5>
                        <p id="cloudiness" class="fs-4 fw-semibold mb-0">--%</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="weather_script.js"></script>
</body>
</html>
